<h1>Trigonometric Table</h1><br>
<div class="mainContent">
  <div class="mb-3">
    <a href="../../index.html" class="btn btn-outline-secondary">&#8592; Back to Home</a>
  </div>
  <table id="trigTable" class="table table-info table-bordered table-responsive align-middle">
    <thead class="table-primary">
      <tr>
        <th>Angle (°)</th>
        <th>Radians</th>
        <th>sin</th>
        <th>cos</th>
        <th>tan</th>
      </tr>
    </thead>
    <tbody id="trigTableBody">
    </tbody>
  </table>
</div>

<script>
  (function () {
    var tbody = document.getElementById('trigTableBody');
    var rows = '';
    for (var deg = 0; deg <= 360; deg++) {
      var rad = deg * Math.PI / 180;
      var sinVal = Math.sin(rad).toFixed(4);
      var cosVal = Math.cos(rad).toFixed(4);
      var tanVal;
      if (deg === 90 || deg === 270) {
        tanVal = '&mdash;';
      } else {
        tanVal = Math.tan(rad).toFixed(4);
      }
      rows += '<tr><td>' + deg + '</td><td>' + rad.toFixed(6) + '</td><td>' + sinVal + '</td><td>' + cosVal + '</td><td>' + tanVal + '</td></tr>';
    }
    tbody.innerHTML = rows;

    $(document).ready(function () {
      $('#trigTable').DataTable({
        pageLength: 25,
        order: [[0, 'asc']]
      });
    });
  })();
</script>
